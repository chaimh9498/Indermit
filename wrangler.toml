name = "indermit-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://indermit.com"
CLERK_ISSUER = "https://your-clerk-domain.clerk.accounts.dev"
OPENAI_IMAGE_MODEL = "gpt-image-2.5-sunburst"
GOOGLE_IMAGE_MODEL = "gemini-3.1-flash-image"
XAI_IMAGE_ENDPOINT = "https://api.x.ai/v1/images/generations"

[[d1_databases]]
binding = "DB"
database_name = "indermit-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "indermit-images"

# Add a custom domain after the first successful deployment:
# routes = [{ pattern = "api.indermit.com", custom_domain = true }]
