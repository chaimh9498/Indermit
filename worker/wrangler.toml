name = "indermit-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
routes = [{ pattern = "api.indermit.com", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
PRIVATE_BETA = "true"
STRIPE_MODE = "live"
BETA_ACCESS_HASH = "c41907783f839244c45d324a69bcb85a6175cd193c9ba80577ccdb03844b1a01"
BETA_ADMIN_HASH = "5e3e664f18062edec371da3c1729849f384457e166b602f895fee6b658d0fa46"
FREE_GENERATIONS_ENABLED = "false"
FRONTEND_URL = "https://indermit.com"
CLERK_ISSUER = "https://clerk.indermit.com"
CLERK_AUTHORIZED_PARTIES = "https://indermit.com"
OPENAI_IMAGE_MODEL = "gpt-image-2.5-sunburst"
GOOGLE_IMAGE_MODEL = "gemini-3.1-flash-lite-image"
XAI_IMAGE_ENDPOINT = "https://api.x.ai/v1/images/generations"
XAI_IMAGE_MODEL = "grok-imagine-image-2.0"
AZURE_MAI_DEPLOYMENT = "indermit-mai-image"

[[d1_databases]]
binding = "DB"
database_name = "indermit-db"
database_id = "50b1d263-1885-4f67-bbc5-94171d8a1f7b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "indermit-images"

[observability]
enabled = true
