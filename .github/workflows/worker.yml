name: Deploy production API

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      AZURE_MAI_API_KEY: ${{ secrets.AZURE_MAI_API_KEY }}
      AZURE_MAI_ENDPOINT: ${{ secrets.AZURE_MAI_ENDPOINT }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      BETA_ACCESS_HASH: ${{ secrets.BETA_ACCESS_HASH }}
      BETA_ADMIN_HASH: ${{ secrets.BETA_ADMIN_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run production checks
        run: npm run check
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply indermit-db --remote --config worker/wrangler.toml
      - name: Deploy Worker
        run: npx wrangler deploy --config worker/wrangler.toml
      - name: Ensure image signing secret
        run: |
          set -euo pipefail
          if ! npx wrangler secret list --config worker/wrangler.toml | grep -q 'IMAGE_SIGNING_SECRET'; then
            openssl rand -hex 32 | npx wrangler secret put IMAGE_SIGNING_SECRET --config worker/wrangler.toml
          fi
      - name: Upload configured service secrets
        run: |
          set -euo pipefail
          put_secret() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config worker/wrangler.toml
            fi
          }
          put_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          put_secret GOOGLE_API_KEY "$GOOGLE_API_KEY"
          put_secret XAI_API_KEY "$XAI_API_KEY"
          put_secret AZURE_MAI_API_KEY "$AZURE_MAI_API_KEY"
          put_secret AZURE_MAI_ENDPOINT "$AZURE_MAI_ENDPOINT"
          put_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          put_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          put_secret CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          put_secret BETA_ACCESS_HASH "$BETA_ACCESS_HASH"
          put_secret BETA_ADMIN_HASH "$BETA_ADMIN_HASH"
      - name: Verify production health
        run: curl --fail --retry 10 --retry-delay 6 --retry-all-errors https://api.indermit.com/v1/health
